<template>

    <div class="main-card">

        <!-- ============================================================
             HEADER SECTION
             ============================================================ -->
        <div class="app-header">
            <div class="header-title-group">
                <div class="header-icon-wrapper">
                    <lightning-icon 
                        icon-name="utility:upload" 
                        size="small" 
                        variant="inverse">
                    </lightning-icon>
                </div>
                <div>
                    <h1 class="header-title">Bulk Data Extractor</h1>
                    <p class="header-subtitle">Upload CSV exports to bulk-process records with full audit logging</p>
                </div>
            </div>
        </div>


        <!-- ============================================================
             UPLOAD SECTION
             ============================================================ -->
        <div class="upload-card">

            <div class="upload-card-content">

                <lightning-input
                    type="file"
                    label="Select CSV File"
                    accept=".csv"
                    onchange={handleFileChange}>
                </lightning-input>

                <template if:true={fileName}>
                    <div class="file-selected-badge">
                        <lightning-icon 
                            icon-name="doctype:csv" 
                            size="small">
                        </lightning-icon>
                        <span>{fileName}</span>
                    </div>
                </template>

            </div>

            <div class="action-bar">
                <lightning-button
                    variant="brand"
                    label="Upload CSV"
                    icon-name="utility:upload"
                    onclick={handleUpload}
                    disabled={isUploadDisabled}>
                </lightning-button>
            </div>

        </div>


        <!-- ============================================================
             PROCESSING INDICATOR
             ============================================================ -->
        <template if:true={isProcessing}>

            <div class="slds-m-top_medium slds-p-around_medium slds-box slds-theme_default slds-align_absolute-center">
                <lightning-spinner 
                    alternative-text="Processing CSV" 
                    size="medium">
                </lightning-spinner>
                <div class="slds-m-left_large">
                    <h3 class="slds-text-heading_small slds-font-weight_bold">Processing Data Import...</h3>
                    <p class="slds-text-body_small slds-text-color_weak">Parsing CSV records and executing bulk upsert batch job.</p>
                </div>
            </div>

        </template>


        <!-- ============================================================
             NOTIFICATIONS & MESSAGES
             ============================================================ -->
        <template if:true={errorMessage}>
            <div class="slds-notify slds-notify_alert slds-alert_error slds-m-top_medium" role="alert">
                <lightning-icon icon-name="utility:error" size="small" variant="inverse" class="slds-m-right_x-small"></lightning-icon>
                <h2>{errorMessage}</h2>
            </div>
        </template>

        <template if:true={successMessage}>
            <div class="slds-notify slds-notify_alert slds-theme_success slds-m-top_medium" role="alert">
                <lightning-icon icon-name="utility:success" size="small" variant="inverse" class="slds-m-right_x-small"></lightning-icon>
                <h2>{successMessage}</h2>
            </div>
        </template>


        <!-- ============================================================
             SUMMARY KPI METRIC DASHBOARD
             ============================================================ -->
        <template if:true={importBatch}>

            <div class="kpi-grid">

                <!-- KPI 1: File & Total Rows -->
                <div class="kpi-card">
                    <div class="kpi-icon total">
                        <lightning-icon icon-name="utility:rows" size="medium"></lightning-icon>
                    </div>
                    <div class="kpi-data">
                        <span class="kpi-value">{importBatch.Total_Rows__c}</span>
                        <span class="kpi-label">Total Rows</span>
                    </div>
                </div>

                <!-- KPI 2: Success Count -->
                <div class="kpi-card">
                    <div class="kpi-icon success">
                        <lightning-icon icon-name="utility:check" size="medium" variant="success"></lightning-icon>
                    </div>
                    <div class="kpi-data">
                        <span class="kpi-value">{importBatch.Success_Count__c}</span>
                        <span class="kpi-label">Successful</span>
                    </div>
                </div>

                <!-- KPI 3: Failure Count -->
                <div class="kpi-card">
                    <div class="kpi-icon failed">
                        <lightning-icon icon-name="utility:warning" size="medium" variant="error"></lightning-icon>
                    </div>
                    <div class="kpi-data">
                        <span class="kpi-value">{importBatch.Failure_Count__c}</span>
                        <span class="kpi-label">Failed Rows</span>
                    </div>
                </div>

                <!-- KPI 4: Status -->
                <div class="kpi-card">
                    <div class="kpi-icon status">
                        <lightning-icon icon-name="utility:info" size="medium"></lightning-icon>
                    </div>
                    <div class="kpi-data">
                        <div>
                            <span class={statusBadgeClass}>{importBatch.Status__c}</span>
                        </div>
                        <span class="kpi-label">Batch Status</span>
                    </div>
                </div>

            </div>

        </template>


        <!-- ============================================================
             RESULTS TABLE & FILTERS
             ============================================================ -->
        <template if:true={importBatch}>

            <div class="filter-bar">
                <span class="filter-title">Import Row Results</span>
                <div class="filter-btn-group">
                    <lightning-button
                        label="All Rows"
                        data-filter="All"
                        variant={isAllVariant}
                        onclick={handleFilterChange}>
                    </lightning-button>

                    <lightning-button
                        label="Successful"
                        data-filter="Success"
                        variant={isSuccessVariant}
                        onclick={handleFilterChange}>
                    </lightning-button>

                    <lightning-button
                        label="Failed"
                        data-filter="Failed"
                        variant={isFailedVariant}
                        onclick={handleFilterChange}>
                    </lightning-button>
                </div>
            </div>

            <!-- Datatable -->
            <template if:true={hasResults}>
                <div class="datatable-wrapper">
                    <lightning-datatable
                        key-field="Id"
                        data={filteredResults}
                        columns={columns}
                        hide-checkbox-column="true">
                    </lightning-datatable>
                </div>
            </template>

            <!-- Empty State -->
            <template if:true={isResultEmpty}>
                <div class="empty-state">
                    <div class="empty-state-icon">
                        <lightning-icon icon-name="utility:search" size="large"></lightning-icon>
                    </div>
                    <h3 class="empty-state-title">No Row Results Found</h3>
                    <p class="empty-state-desc">There are no records matching the selected filter ({selectedFilter}).</p>
                </div>
            </template>

        </template>

    </div>

</template>
